spring.application.name=baozi-store

# Conexao com o MySQL
# O banco baozi_store e criado automaticamente se ainda nao existir
spring.datasource.url=jdbc:mysql://localhost:3306/baozi_store?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Fortaleza
spring.datasource.username=baozi
spring.datasource.password=baozi123

# JPA / Hibernate
# update = cria e atualiza as tabelas a partir das entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Porta da API
server.port=8080
